[pytest]
# Ben 2026-10-16: a fast everyday run. `pytest` skips the tests marked slow (migration round trips and the
# whole-demo tests); before every merge run everything: `pytest -m "" -n 4` (see CLAUDE.md, Test).
markers =
    slow: migration round trips and whole-demo tests — run before every merge with -m ""
addopts = -m "not slow"
