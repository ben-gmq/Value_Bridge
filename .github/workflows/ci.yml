# Runs once the repository has a GitHub remote (A-63). Mirrors the local checks.
name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_USER: ci, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m venv venv && ./venv/bin/pip install -q -r requirements.txt
      - name: Create roles and databases
        run: VB_EMAIL_DOMAINS=example.test ./scripts/bootstrap_local_db.sh
      - run: ./venv/bin/pytest -q
      - name: Models and migrations agree (no autogenerate drift)
        run: ./venv/bin/alembic upgrade head && ./venv/bin/alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci && npm run lint && npm run build

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Banned patterns (CLAUDE.md "The VB law")
        run: |
          set -e
          ! grep -rnE "level_no\s*={1,2}\s*5" backend frontend/src --include=*.py --include=*.js --include=*.jsx
          ! grep -rnE "fr_type_code\S*\s*==\s*['\"]INTERFACE" backend frontend/src --include=*.py --include=*.js --include=*.jsx
          ! grep -rn "dangerouslySetInnerHTML" frontend/src
          ! grep -rnE "onupdate=(func|datetime|lambda|now)" backend/models
